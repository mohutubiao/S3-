[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<ines_header.cpp> +<ines_header.h> +<mapper_bank.cpp> +<mapper_bank.h> +<serial_controller.cpp> +<serial_controller.h> +<touch_layout.cpp> +<touch_layout.h> +<touch_controls.cpp> +<touch_controls.h> +<rom_storage.cpp> +<rom_storage.h> +<ota_version.cpp> +<ota_version.h> +<device_identity_format.cpp> +<device_identity_format.h>

[env:esp32c3-gamepad]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDIJI_GAMEPAD_FIRMWARE_VERSION=\"0.1.3\"
    -DDIJI_GAMEPAD_OTA_CHANNEL=\"esp32c3-gamepad\"
    -DDIJI_GAMEPAD_A_PIN=0
    -DDIJI_GAMEPAD_B_PIN=1
    ; 2026-11-05 临时关闭 SELECT：GPIO8 是板上蓝灯的引脚，线上挂有限流电阻对地，
    ; 内部 45k 上拉压不住，恒读低 → 每个状态包都伪造 0x04（SELECT 常按）。
    ; 拆掉蓝灯无改善，说明电阻仍在。改用 GPIO5（原设计脚）或拆电阻后再改回来。
    -DDIJI_GAMEPAD_SELECT_PIN=5
    -DDIJI_GAMEPAD_START_PIN=4
    -DDIJI_GAMEPAD_UP_PIN=7
    -DDIJI_GAMEPAD_DOWN_PIN=21
    -DDIJI_GAMEPAD_LEFT_PIN=10
    -DDIJI_GAMEPAD_RIGHT_PIN=20
    -DDIJI_GAMEPAD_LED_PIN=-1
    -DDIJI_GAMEPAD_LED_ACTIVE_LEVEL=1
    -DDIJI_GAMEPAD_BATTERY_PIN=-1
    -DDIJI_GAMEPAD_RUMBLE_PIN=-1
    ; 2026-11-05 第三版接线：按用户要求 A/B 对调、X/Y 对调（A0 B1 X3 Y2），
    ; 其余不变：START4 上9 下21 左10 右20。
    ; GPIO9(上)/GPIO0(现在是A) 是 strapping 脚，上电瞬间别按住 A。
    ; 2026-11-05 临时关闭 X 连发：GPIO3 实测会持续被拉低（连发键误触发，A 一直在
    ; 自动连打），补焊后读数时好时坏，先关掉，需要连发再接回 GPIO5/GPIO6。
    -DDIJI_GAMEPAD_X_PIN=6
    -DDIJI_GAMEPAD_Y_PIN=2
build_src_filter = +<espnow_gamepad.cpp> +<espnow_gamepad_protocol.h> +<serial_controller.cpp> +<serial_controller.h> +<network_security.cpp> +<network_security.h> +<ota_version.cpp> +<ota_version.h>

