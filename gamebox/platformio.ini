; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; default_envs = esp32c3-gamepad
default_envs = lcdwiki-es3c28p


; 大肥鱼（小智 S3 相机板）双固件环境：烧进 ota_1 @0x620000，与小智固件共存。
; ROM 存 romfs 分区（3MB LittleFS）；游戏操作配 ESP-NOW 无线手柄（esp32c3-gamepad）。
[env:xiaozhi-daifeiyu]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.0.4
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_ota_romfs_16mb.csv
board_build.filesystem = littlefs
board_build.embed_files = assets/gamebox_clock_wallpaper.jpg
board_build.extra_flags = -DBOARD_HAS_PSRAM -DDISABLE_ALL_LIBRARY_WARNINGS
monitor_speed = 115200
upload_speed = 921600

build_unflags = -Os -O2
build_flags =
    -DDIJI_BOARD_ZHENGCHEN_DAFEIYU
    -DDIJI_FIRMWARE_VERSION=\"0.6.6-dafeiyu\"
    -DDIJI_OTA_CHANNEL=\"xiaozhi-daifeiyu\"
    -DDIJI_ENABLE_SERIAL_CONTROLLER=1
    -Ofast
    -funroll-loops
    -fstrict-aliasing
    -fno-exceptions
    -ffunction-sections
    -fdata-sections

build_src_filter = +<*.cpp> +<*.ino> +<*.h> -<espnow_gamepad.cpp> -<.git/> -<.pio/> -<.DS_Store>

